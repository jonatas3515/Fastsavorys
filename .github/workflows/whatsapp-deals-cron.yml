name: Disparo Automático de Ofertas no WhatsApp (FastSavory's)

on:
  # Permite disparar manualmente a qualquer momento pelo botão "Run workflow" no GitHub
  # Os agendamentos automáticos de hora em hora rodam exclusivamente via cron-job.org
  workflow_dispatch:
    inputs:
      mode:
        description: 'Tipo de produto a disparar (auto, affiliate, fastsavorys)'
        required: false
        default: 'auto'

jobs:
  send-deal:
    name: Enviar Oferta para o Grupo do WhatsApp
    runs-on: ubuntu-latest
    steps:
      - name: 🔔 Acordar Instância da Evolution API (Render Warm-up)
        run: |
          echo "🌐 Verificando e acordando a API no Render..."
          for i in {1..12}; do
            STATUS_RENDER=$(curl -s -o /dev/null -w "%{http_code}" https://fast-whatsapp-api.onrender.com/ || true)
            echo "Tentativa $i: HTTP Status $STATUS_RENDER"
            if [ "$STATUS_RENDER" -eq 200 ] || [ "$STATUS_RENDER" -eq 401 ] || [ "$STATUS_RENDER" -eq 404 ]; then
              echo "✅ Evolution API acordada e pronta!"
              break
            fi
            sleep 5
          done

      - name: 🚀 Executar Endpoint de Disparo
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          echo "🚀 Disparando rotina de envio de oferta (Modo: $MODE)..."
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://fastsavorys.vercel.app/api/cron?action=send-whatsapp-deal&mode=$MODE" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "x-cron-secret: fastsavorys-cron-secret-2026" \
            -H "Content-Type: application/json")
          
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Status Code: $STATUS"
          echo "Resposta: $BODY"

          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Erro ao disparar oferta!"
            exit 1
          fi

          echo "✅ Oferta enviada com sucesso!"
