name: Disparo Automático de Ofertas no WhatsApp (FastSavory's)

on:
  schedule:
    # 13 Disparos Diários (08:00 às 20:00 BRT / UTC-3 -> 11:00 às 23:00 UTC)
    # 08:00 BRT -> 11:00 UTC (Achadinhos)
    # 09:00 BRT -> 12:00 UTC (Achadinhos)
    # 10:00 BRT -> 13:00 UTC (Achadinhos)
    # 11:00 BRT -> 14:00 UTC (🥟 FastSavory's - Salgados / Almoço)
    # 12:00 BRT -> 15:00 UTC (Achadinhos)
    # 13:00 BRT -> 16:00 UTC (🥟 FastSavory's - Salgados / Almoço Tarde)
    # 14:00 BRT -> 17:00 UTC (Achadinhos)
    # 15:00 BRT -> 18:00 UTC (🥟 FastSavory's - Salgados / Lanche)
    # 16:00 BRT -> 19:00 UTC (Achadinhos)
    # 17:00 BRT -> 20:00 UTC (🥟 FastSavory's - Salgados / Jantar / Festas)
    # 18:00 BRT -> 21:00 UTC (Achadinhos)
    # 19:00 BRT -> 22:00 UTC (Achadinhos)
    # 20:00 BRT -> 23:00 UTC (Achadinhos)
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
  
  # Permite disparar manualmente a qualquer momento pelo botão "Run workflow" no GitHub
  workflow_dispatch:
    inputs:
      mode:
        description: 'Tipo de produto a disparar (auto, affiliate, fastsavorys)'
        required: false
        default: 'auto'

jobs:
  send-deal:
    name: Enviar Oferta para o Grupo do WhatsApp
    runs-on: ubuntu-latest
    steps:
      - name: 🔔 Acordar Instância da Evolution API (Render Warm-up)
        run: |
          echo "🌐 Verificando e acordando a API no Render..."
          for i in {1..12}; do
            STATUS_RENDER=$(curl -s -o /dev/null -w "%{http_code}" https://fast-whatsapp-api.onrender.com/ || true)
            echo "Tentativa $i: HTTP Status $STATUS_RENDER"
            if [ "$STATUS_RENDER" -eq 200 ] || [ "$STATUS_RENDER" -eq 401 ] || [ "$STATUS_RENDER" -eq 404 ]; then
              echo "✅ Evolution API acordada e pronta!"
              break
            fi
            sleep 5
          done

      - name: 🚀 Executar Endpoint de Disparo
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          echo "🚀 Disparando rotina de envio de oferta (Modo: $MODE)..."
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://fastsavorys.vercel.app/api/cron/send-whatsapp-deal?mode=$MODE" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Status Code: $STATUS"
          echo "Resposta: $BODY"

          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Erro ao disparar oferta!"
            exit 1
          fi

          echo "✅ Oferta enviada com sucesso!"
